apiVersion: batch/v1
kind: Job
metadata:
  name: portal-b-day-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: localhost/portal-b-day:bootstrap-20260904
          imagePullPolicy: Never
          command: ["bun", "x", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portal-b-day-secrets
                  key: migration-url
