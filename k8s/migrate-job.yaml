apiVersion: batch/v1
kind: Job
metadata:
  name: portal-b-day-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: localhost/portal-b-day:dual-20260904
          imagePullPolicy: Never
          command: ["sh", "-ec"]
          args:
            - |
              cp -R /app/prisma /tmp/prisma
              if [ -d /tmp/prisma/migrations/20260904040000_wecom_app ]; then
                rmdir /tmp/prisma/migrations/20260904040000_wecom_app
              fi
              bun x prisma migrate deploy --schema /tmp/prisma/schema.prisma
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portal-b-day-secrets
                  key: migration-url
