services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family
      POSTGRES_USER: bday_owner
      POSTGRES_PASSWORD: bday_local_password
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bday_owner -d family"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - bday-postgres:/var/lib/postgresql/data

volumes:
  bday-postgres:
